<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="900" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arrow-a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="20" y="34" width="230" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="135" y="54" text-anchor="middle" font-size="12" fill="#9ca3af">STEP 1</text>
  <text x="135" y="74" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">draw tool now lives</text>
  <text x="135" y="90" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">inside regions panel</text>

  <line x1="250" y1="66" x2="286" y2="66" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-a)"/>

  <rect x="290" y="34" width="200" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="390" y="60" text-anchor="middle" font-size="12" fill="#9ca3af">STEP 2</text>
  <text x="390" y="80" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">draw region on map</text>

  <line x1="490" y1="66" x2="526" y2="66" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-a)"/>

  <rect x="530" y="34" width="350" height="64" rx="10" fill="#f0fdf6" stroke="#22a35e" stroke-width="1.5"/>
  <text x="705" y="54" text-anchor="middle" font-size="12" fill="#178a4c">STEP 3</text>
  <text x="705" y="74" text-anchor="middle" font-size="13" fill="#166b3d" font-weight="700">auto-added to "drawn regions"</text>
  <text x="705" y="90" text-anchor="middle" font-size="12" fill="#178a4c">persists until refresh</text>

  <!-- connector down to row 2 -->
  <line x1="705" y1="98" x2="705" y2="130" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="135" y1="130" x2="705" y2="130" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="135" y1="130" x2="135" y2="164" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-a)"/>

  <!-- Row 2 -->
  <rect x="20" y="168" width="250" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="145" y="188" text-anchor="middle" font-size="12" fill="#9ca3af">STEP 4</text>
  <text x="145" y="208" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">click region name in</text>
  <text x="145" y="224" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">sidebar → toggle visibility</text>

  <line x1="270" y1="200" x2="306" y2="200" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-a)"/>

  <rect x="310" y="168" width="260" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="440" y="188" text-anchor="middle" font-size="12" fill="#9ca3af">STEP 5</text>
  <text x="440" y="208" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">click region ON MAP →</text>
  <text x="440" y="224" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">highlight / select it</text>

  <line x1="570" y1="200" x2="606" y2="200" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-a)"/>

  <rect x="610" y="168" width="270" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="745" y="188" text-anchor="middle" font-size="12" fill="#9ca3af">STEP 6</text>
  <text x="745" y="208" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">"analyze" + "see vessels"</text>
  <text x="745" y="224" text-anchor="middle" font-size="13" fill="#374151" font-weight="600">enabled for that region</text>

  <!-- fork -->
  <line x1="745" y1="232" x2="745" y2="264" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="560" y1="264" x2="790" y2="264" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="560" y1="264" x2="560" y2="294" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-a)"/>
  <line x1="790" y1="264" x2="790" y2="294" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-a)"/>

  <!-- left branch: analyze -->
  <rect x="440" y="298" width="240" height="64" rx="10" fill="#f0fdf6" stroke="#22a35e" stroke-width="1.5"/>
  <text x="560" y="324" text-anchor="middle" font-size="13" fill="#166b3d" font-weight="700">click "analyze"</text>
  <text x="560" y="342" text-anchor="middle" font-size="11.5" fill="#178a4c">runs analysis on selected region</text>

  <!-- right branch: clear -->
  <rect x="685" y="298" width="210" height="64" rx="10" fill="#f0fdf6" stroke="#22a35e" stroke-width="1.5"/>
  <text x="790" y="322" text-anchor="middle" font-size="13" fill="#166b3d" font-weight="700">click "clear"</text>
  <text x="790" y="338" text-anchor="middle" font-size="11" fill="#178a4c">clears vessels shown,</text>
  <text x="790" y="352" text-anchor="middle" font-size="11" fill="#178a4c">not the region</text>

  <!-- bottom summary -->
  <rect x="60" y="480" width="780" height="64" rx="10" fill="#eef6ff" stroke="#0466c8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="502" text-anchor="middle" font-size="13" fill="#0466c8" font-weight="700">the benefit</text>
  <text x="450" y="522" text-anchor="middle" font-size="12.5" fill="#0a4f96">regions are reusable, one clear active selection at a time, and it's now consistent with predefined regions</text>
</svg>
