<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>

  <defs>
    <marker id="arrow-b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="30" y="34" width="190" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="125" y="60" text-anchor="middle" font-size="12" fill="#9ca3af">STEP 1</text>
  <text x="125" y="80" text-anchor="middle" font-size="13.5" fill="#374151" font-weight="600">click "draw" in sidebar</text>

  <line x1="220" y1="66" x2="256" y2="66" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-b)"/>

  <rect x="260" y="34" width="190" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="355" y="60" text-anchor="middle" font-size="12" fill="#9ca3af">STEP 2</text>
  <text x="355" y="80" text-anchor="middle" font-size="13.5" fill="#374151" font-weight="600">draw shape on map</text>

  <line x1="450" y1="66" x2="486" y2="66" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-b)"/>

  <rect x="490" y="34" width="230" height="64" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="605" y="52" text-anchor="middle" font-size="12" fill="#9ca3af">STEP 3</text>
  <text x="605" y="72" text-anchor="middle" font-size="13.5" fill="#374151" font-weight="600">"analyze" + "clear"</text>
  <text x="605" y="88" text-anchor="middle" font-size="13.5" fill="#374151" font-weight="600">buttons appear</text>

  <!-- fork -->
  <line x1="605" y1="98" x2="605" y2="130" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="430" y1="130" x2="780" y2="130" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="430" y1="130" x2="430" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-b)"/>
  <line x1="780" y1="130" x2="780" y2="160" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-b)"/>

  <!-- left branch: analyze -->
  <rect x="325" y="164" width="210" height="56" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="430" y="197" text-anchor="middle" font-size="13.5" fill="#374151" font-weight="600">click "analyze"</text>

  <line x1="430" y1="220" x2="430" y2="252" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-b)"/>

  <rect x="310" y="256" width="240" height="64" rx="10" fill="#fff5f2" stroke="#ef5f33" stroke-width="1.5"/>
  <text x="430" y="282" text-anchor="middle" font-size="13.5" fill="#ef5f33" font-weight="700">button becomes "see" (eye icon)</text>
  <text x="430" y="300" text-anchor="middle" font-size="11.5" fill="#ef5f33">same button, new meaning</text>

  <!-- right branch: clear -->
  <rect x="675" y="164" width="210" height="56" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="780" y="197" text-anchor="middle" font-size="13.5" fill="#374151" font-weight="600">click "clear"</text>

  <line x1="780" y1="220" x2="780" y2="252" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow-b)"/>

  <rect x="665" y="256" width="230" height="64" rx="10" fill="#fff5f2" stroke="#ef5f33" stroke-width="1.5"/>
  <text x="780" y="282" text-anchor="middle" font-size="13.5" fill="#ef5f33" font-weight="700">region deleted</text>
  <text x="780" y="300" text-anchor="middle" font-size="11.5" fill="#ef5f33">one-time use, can't reuse</text>

  <!-- bottom summary -->
  <rect x="60" y="380" width="780" height="60" rx="10" fill="#fff5f2" stroke="#ef5f33" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="450" y="405" text-anchor="middle" font-size="13" fill="#ef5f33" font-weight="700">the issue</text>
  <text x="450" y="425" text-anchor="middle" font-size="12.5" fill="#b23c1f">too many buttons living in one sidebar — the region itself isn't reusable or interactive with anything else</text>
</svg>
